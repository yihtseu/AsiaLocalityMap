name: Release APK to GitHub Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version name, for example 0.1.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Check signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Secret: $name"
              exit 1
            fi
          done

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK 37.2
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Determine release version
        id: version
        shell: bash
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          ANDROID_VERSION_CODE_BASE: ${{ vars.ANDROID_VERSION_CODE_BASE || '1' }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          event = os.environ["GITHUB_EVENT_NAME"]
          ref_type = os.environ["GITHUB_REF_TYPE"]
          ref_name = os.environ["GITHUB_REF_NAME"]
          if event == "push" and ref_type == "tag" and ref_name.startswith("v"):
              version_name = ref_name[1:]
              tag = ref_name
          elif event == "workflow_dispatch":
              version_name = os.environ["INPUT_VERSION_NAME"].lstrip("v")
              tag = f"v{version_name}"
          else:
              raise SystemExit("Release requires a v* tag or workflow_dispatch.")
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?", version_name):
              raise SystemExit(f"Invalid version name: {version_name}")
          base = int(os.environ.get("ANDROID_VERSION_CODE_BASE") or "1")
          version_code = base + int(os.environ["GITHUB_RUN_NUMBER"])
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as out:
              out.write(f"tag={tag}\nversion_name={version_name}\nversion_code={version_code}\n")
          print(f"Release {tag} (versionName={version_name}, versionCode={version_code})")
          PY

      - name: Install data preparation dependencies
        run: python -m pip install -r requirements.txt

      - name: Download, prepare and validate offline research data
        run: |
          python scripts/download_sources.py
          python scripts/fetch_japan.py
          python scripts/prepare_data.py
          python -m unittest discover -s tests -v

      - name: Restore keystore and resolve alias
        id: keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          if [[ -n "$ANDROID_KEY_ALIAS" ]]; then
            ALIAS="$ANDROID_KEY_ALIAS"
          else
            ALIAS="$(keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              | awk -F',' '/PrivateKeyEntry/ {print $1; exit}')"
          fi
          if [[ -z "$ALIAS" ]]; then
            echo "::error::Could not determine key alias from keystore"
            exit 1
          fi
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK and run lint
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ steps.keystore.outputs.alias }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: >-
          ./gradlew --no-daemon --stacktrace
          -PreleaseVersionCode="$RELEASE_VERSION_CODE"
          -PreleaseVersionName="$RELEASE_VERSION_NAME"
          :app:assembleRelease :app:lintRelease

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          APK="asia-locality-map-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "$TAG" --generate-notes
          fi

      - name: Upload release lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-lint-reports
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove keystore
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks"
